<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Watch</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : prefersDark ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme =
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    })();
  </script>
</head>
<body>
  <header>
    <span class="title">Flight Watch</span>
    <form id="search">
      <input id="flight" type="text" placeholder="Flight number, e.g. QF25" aria-label="Flight number">
      <button type="submit">Search</button>
    </form>
    <button id="theme-toggle" type="button">Dark mode</button>
    <span id="message" role="status"></span>
  </header>
  <main>
    <div id="map"></div>
    <aside id="route-panel" hidden>
      <button id="route-toggle" type="button" aria-expanded="true" aria-controls="route-list">On your route</button>
      <ul id="route-list"></ul>
    </aside>
  </main>
  <footer>For learning only, not for flight planning. · Routes: <a href="https://github.com/mrjackwills/adsbdb">adsbdb</a> (a flight's usual airports; the line between them is approximate, not the flight plan) · Airports: <a href="https://ourairports.com">OurAirports</a> · Warnings: <a href="https://aviationweather.gov">aviationweather.gov</a> · Volcano alerts: <a href="https://volcanoes.usgs.gov">USGS</a></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="map.js"></script>
</body>
</html>
